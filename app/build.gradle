plugins {
    id "com.android.application"
}

android {
    namespace "in.jandwar.app"
    compileSdk 35

    defaultConfig {
        applicationId "in.jandwar.app"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }
}

dependencies {
    // HTTP client for Bhashini + Groq API calls
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
